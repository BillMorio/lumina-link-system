databases:
  - name: lumina-link-system-db
    databaseName: lumina_link_system
    user: lumina
    plan: free
    region: oregon

services:
  - type: web
    name: lumina-link-system-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lumina-link-system-db
          property: connectionString
